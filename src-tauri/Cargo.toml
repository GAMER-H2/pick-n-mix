[package]
name = "pick-n-mix"
version = "0.1.0"
description = "A local music player with a live DJ mixer"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pick_n_mix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# audio
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
rubato = "0.16"
rtrb = "0.3"
crossbeam-channel = "0.5"
arc-swap = "1"

# library
rusqlite = { version = "0.37", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# misc
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
