[package]
name = "pick-n-mix"
version = "0.1.0"
description = "A local music player with a live DJ mixer"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pick_n_mix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# audio
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
rubato = "0.16"
# Bounce-to-file: WAV is written by hand and FLAC has a pure-Rust encoder, so
# both are self-contained. MP3 is deliberately not: every usable encoder is
# LGPL or worse to link statically, so it is delegated to an ffmpeg the user
# already has. See `audio/ffmpeg.rs`.
flacenc = "0.4"
rtrb = "0.3"
crossbeam-channel = "0.5"
arc-swap = "1"

# library
rusqlite = { version = "0.37", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
# Cover art thumbnails: decode whatever embedded picture formats show up in
# practice, encode thumbnails as jpeg regardless of the source format.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# misc
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
# Media controls. zbus rather than the default dbus binding, so a Linux build
# stays pure Rust and self-contained; irrelevant on macOS, which uses
# MPNowPlayingInfoCenter.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

# Dependencies are optimised even in a debug build, while this crate stays
# unoptimised and debuggable.
#
# Audio decoding and resampling are almost entirely `symphonia` and `rubato`,
# and unoptimised they are dramatically slower — decoding the six packaged
# atmospheres took 101 seconds in a plain debug build against 2.4 in release,
# which is the difference between an atmosphere starting and appearing not to
# work at all. `tauri dev` builds in debug, so this is the profile the app is
# actually developed against.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
